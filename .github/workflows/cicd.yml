name: Stroke Prediction CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  FASTAPI_IMAGE: ${{ secrets.DOCKER_USERNAME }}/stroke-fastapi
  STREAMLIT_IMAGE: ${{ secrets.DOCKER_USERNAME }}/stroke-streamlit
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Basic Check (tests replace ho ga jab likhoge)
  # ─────────────────────────────────────────
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Linter
        run: pip install flake8

      - name: Lint FastAPI Code
        run: |
          flake8 FastApi/main.py \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --count

      - name: Lint Streamlit Code
        run: |
          flake8 Ui/App.py \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --count

      - name: Check Tests Exist (Warning only)
        run: |
          if [ ! -d "tests" ]; then
            echo "⚠️  WARNING: tests/ folder not found — skipping pytest"
            echo "   Tip: Create tests/test_api.py to enable test runs"
          else
            pip install pytest pytest-asyncio httpx
            pytest tests/ -v --tb=short
          fi

  # ─────────────────────────────────────────
  # JOB 2: Build & Push FastAPI Image
  # ─────────────────────────────────────────
  build-fastapi:
    name: Build FastAPI Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile         # FastApi Dockerfile (port 8000)
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE }}:latest
            ${{ env.FASTAPI_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: Build & Push Streamlit Image
  # ─────────────────────────────────────────
  build-streamlit:
    name: Build Streamlit Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Streamlit Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Ui/Dockerfile       # Streamlit Dockerfile (port 8501)
          push: true
          tags: |
            ${{ env.STREAMLIT_IMAGE }}:latest
            ${{ env.STREAMLIT_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 4: Deploy Both (main branch only)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-fastapi, build-streamlit]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # ── Pull latest images ──
            docker pull ${{ env.FASTAPI_IMAGE }}:latest
            docker pull ${{ env.STREAMLIT_IMAGE }}:latest

            # ── FastAPI Container ──
            docker stop stroke-fastapi || true
            docker rm   stroke-fastapi || true
            docker run -d \
              --name stroke-fastapi \
              --restart always \
              -p 8000:8000 \
              --env-file /home/${{ secrets.SERVER_USER }}/.env \
              ${{ env.FASTAPI_IMAGE }}:latest

            # ── Streamlit Container ──
            docker stop stroke-streamlit || true
            docker rm   stroke-streamlit || true
            docker run -d \
              --name stroke-streamlit \
              --restart always \
              -p 8501:8501 \
              --add-host=host.docker.internal:host-gateway \
              ${{ env.STREAMLIT_IMAGE }}:latest

            echo "✅ FastAPI  → http://YOUR_SERVER_IP:8000"
            echo "✅ Streamlit → http://YOUR_SERVER_IP:8501"