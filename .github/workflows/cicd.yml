name: Stroke Prediction CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Basic Check
  # ─────────────────────────────────────────
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Linter
        run: pip install flake8

      - name: Lint FastAPI Code
        run: |
          flake8 FastApi/main.py \
            --max-line-length=150 \
            --ignore=E221,E224,E225,E226,E241,E251,E265,E302,E305,E501,W291,W292,W293,W503,F841

      - name: Lint Streamlit Code
        run: |
          flake8 Ui/App.py \
            --max-line-length=150 \
            --ignore=E221,E224,E225,E226,E241,E251,E265,E302,E305,E501,W291,W292,W293,W503,F841

      - name: Run Tests (if tests/ exists)
        run: |
          if [ ! -d "tests" ]; then
            echo "⚠️  WARNING: tests/ folder not found — skipping pytest"
          else
            pip install pytest pytest-asyncio httpx
            pytest tests/ -v --tb=short
          fi

  # ─────────────────────────────────────────
  # JOB 2: Build & Push FastAPI Image
  # FastApi/main.py  |  Dockerfile (root)
  # ─────────────────────────────────────────
  build-fastapi:
    name: Build FastAPI Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERROR: DOCKER_USERNAME secret is not set!"
            echo "Go to: Repo → Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ ERROR: DOCKER_PASSWORD secret is not set!"
            exit 1
          fi
          echo "✅ Docker secrets verified: ${{ secrets.DOCKER_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push FastAPI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || github.repository_owner }}/stroke-fastapi:latest
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || github.repository_owner }}/stroke-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: Build & Push Streamlit Image
  # Ui/App.py  |  Ui/Dockerfile
  # ─────────────────────────────────────────
  build-streamlit:
    name: Build Streamlit Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERROR: DOCKER_USERNAME secret is not set!"
            echo "Go to: Repo → Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ ERROR: DOCKER_PASSWORD secret is not set!"
            exit 1
          fi
          echo "✅ Docker secrets verified: ${{ secrets.DOCKER_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Streamlit Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || github.repository_owner }}/stroke-streamlit:latest
            ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || github.repository_owner }}/stroke-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max